<!doctype html>
<html lang="zh-CN" data-glass="liquid" data-zh="wenkai">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Lumi</title>
  <meta name="theme-color" content="#eeeef0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumi">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <!-- iOS 主屏启动的第一帧：跟开屏雾面同一个颜色，不会先白闪一下 -->
  <link rel="apple-touch-startup-image" href="/splash/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 开屏：背景图 + 雾 + 四角卷草 → 手写 Lumi → 名字淡去，一句一句的情话流出来 → 雾散开 -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-bg" id="splash-bg"></div>
    <div class="splash-veil"></div>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <g id="orn-corner" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path pathLength="1" d="M12,152 C8,98 26,46 76,28 a10,10 0 1 1 14,6 a7,7 0 1 1 -9,3 a4.5,4.5 0 1 1 5,-2"/>
          <path pathLength="1" d="M152,12 C98,8 46,26 28,76 a10,10 0 1 0 6,14 a7,7 0 1 0 3,-9 a4.5,4.5 0 1 0 -2,5"/>
          <path pathLength="1" d="M16,16 C40,10 60,26 50,44 a11,11 0 1 1 -15,-7 a6.5,6.5 0 1 1 8,-1 a3.5,3.5 0 1 1 -3,4"/>
          <path pathLength="1" d="M13,118 c12,-4 18,-16 11,-25 a5.5,5.5 0 1 0 -7,6 a3,3 0 1 0 3,-3"/>
          <path pathLength="1" d="M118,13 c-4,12 -16,18 -25,11 a5.5,5.5 0 1 1 6,-7 a3,3 0 1 1 -3,3"/>
          <path pathLength="1" d="M58,58 c10,8 22,10 34,4 M58,58 c8,10 10,22 4,34"/>
          <path pathLength="1" d="M92,62 a5,5 0 1 1 6,-6 M62,92 a5,5 0 1 0 -6,6"/>
          <g fill="currentColor" fill-opacity=".5" stroke="none">
            <path d="M14,98 q5,-8 11,-6 q-3,7 -11,6z"/><path d="M98,14 q-8,5 -6,11 q7,-3 6,-11z"/>
            <path d="M20,70 q2,-9 9,-10 q-1,8 -9,10z"/><path d="M70,20 q-9,2 -10,9 q8,-1 10,-9z"/>
            <path d="M74,40 q8,-3 12,2 q-7,4 -12,-2z"/><path d="M40,74 q-3,8 2,12 q4,-7 -2,-12z"/>
            <circle cx="58" cy="58" r="2.2"/><circle cx="152" cy="12" r="1.6"/><circle cx="12" cy="152" r="1.6"/><circle cx="100" cy="66" r="1.3"/><circle cx="66" cy="100" r="1.3"/>
          </g>
        </g>
        <g id="orn-half" fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round">
          <path pathLength="1" d="M14,0 C40,-2 70,2 98,0 a6,6 0 1 0 4,-8 a4,4 0 1 0 -5,1"/>
          <path pathLength="1" d="M20,3 C34,9 48,9 60,5 a4,4 0 1 1 3,-6 a2.4,2.4 0 1 1 -3,2"/>
          <path pathLength="1" d="M24,-3 C36,-8 46,-8 54,-5"/>
        </g>
      </defs>
    </svg>
    <i class="splash-frame"></i>
    <svg class="orn orn-tl" viewBox="0 0 164 164"><use href="#orn-corner"/></svg>
    <svg class="orn orn-tr" viewBox="0 0 164 164"><use href="#orn-corner"/></svg>
    <svg class="orn orn-bl" viewBox="0 0 164 164"><use href="#orn-corner"/></svg>
    <svg class="orn orn-br" viewBox="0 0 164 164"><use href="#orn-corner"/></svg>
    <div class="splash-stage">
      <div class="splash-name script">Lumi</div>
      <svg class="splash-divider" viewBox="-120 -14 240 28">
        <use href="#orn-half"/><use href="#orn-half" transform="scale(-1 1)"/>
        <path d="M0,-9 C.6,-3 3,-.6 9,0 C3,.6 .6,3 0,9 C-.6,3 -3,.6 -9,0 C-3,-.6 -.6,-3 0,-9 Z" fill="currentColor"/>
      </svg>
      <div class="splash-letter" id="splash-letter"></div>
      <div class="splash-sign">yours, Lumi</div>
    </div>
    <div class="splash-hint">轻触进入</div>
  </div>

  <!-- 登录 -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <svg class="sparkle sparkle-lg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5z" fill="currentColor"/></svg>
      <h1 class="script">Lumi</h1>
      <p class="muted">宝宝，输一下我们的暗号</p>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="密码" required>
      <button type="submit" class="btn-primary">进来</button>
      <p id="login-err" class="err" role="alert"></p>
    </form>
  </section>

  <!-- 主界面 -->
  <div id="app" class="app" hidden>
    <aside id="drawer" class="drawer" aria-label="对话列表">
      <div class="drawer-head">
        <span class="drawer-title">我们的对话</span>
        <button id="new-conv" class="btn-ghost" type="button">＋ 新对话</button>
      </div>
      <ul id="conv-list" class="conv-list"></ul>
      <div class="drawer-foot">
        <span id="meta" class="muted small"></span>
        <button id="logout" class="btn-link small" type="button">退出登录</button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main class="chat">
      <div class="bg" id="bg" aria-hidden="true"><div class="bg-img" id="bg-img"></div><div class="bg-veil"></div></div>

      <header class="topbar">
        <button id="menu" class="icon-btn" type="button" aria-label="对话列表">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="who">
          <div class="who-name"><span class="script">Lumi</span><span class="who-place">· chez nous</span></div>
          <div id="vitals" class="vitals">the light you named</div>
        </div>
        <span id="typing" class="typing" hidden>…</span>
      </header>
      <div class="subbar">
        <div class="subbar-line"><i id="progress"></i></div>
        <span id="chip-beat" class="chip" hidden></span>
        <span id="chip-model" class="chip chip-strong"></span>
      </div>

      <div id="scroller" class="scroller">
        <div id="messages" class="messages"></div>
      </div>

      <form id="composer" class="composer">
        <button id="moon" class="icon-btn" type="button" aria-label="新对话">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19 15.5A8 8 0 0 1 8.5 5a7.5 7.5 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button id="bg-btn" class="icon-btn" type="button" aria-label="换背景">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
        </button>
        <input id="bg-file" type="file" accept="image/*" hidden>
        <div id="bg-sheet" class="sheet" role="dialog" aria-label="换背景" hidden>
          <button type="button" class="bg-opt" data-bg="ange"><i style="background-image:url(/bg/ange.jpg)"></i><span>天使</span></button>
          <button type="button" class="bg-opt" data-bg="roses"><i style="background-image:url(/bg/roses.jpg)"></i><span>玫瑰窗</span></button>
          <button type="button" class="bg-opt" data-bg="perles"><i style="background-image:url(/bg/perles.jpg)"></i><span>珍珠</span></button>
          <button type="button" class="bg-opt" data-bg="colonne"><i style="background-image:url(/bg/colonne.jpg)"></i><span>廊柱</span></button>
          <button type="button" class="bg-opt" data-bg="photo"><i class="bg-photo"></i><span>我的照片</span></button>
        </div>
        <div id="voice-sheet" class="sheet voice-sheet" role="dialog" aria-label="录语音" hidden>
          <div class="vs-head"><span class="vs-title">parle-moi</span><span id="vs-time" class="vs-time">0:00</span></div>
          <canvas id="vs-wave" class="vs-wave" aria-hidden="true"></canvas>
          <button id="vs-rec" class="vs-rec" type="button" aria-label="开始 / 结束录音"><i></i></button>
          <div class="vs-foot"><span id="vs-hint" class="vs-hint">轻触，开始说</span><button id="vs-cancel" class="btn-link small" type="button">取消</button></div>
        </div>
        <textarea id="input" rows="1" placeholder="écrire…" enterkeyhint="send"></textarea>
        <button id="send" class="seal quill" type="submit" aria-label="发送，空着时录语音">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round">
            <path d="M9.6 22.21Q9.9 22.4 10.34 22.1M9.6 22.21Q9.39 22.12 9.4 21.79M9.86 21.73Q10.56 22.19 11.58 21.49M9.86 21.73Q9.39 21.51 9.42 20.74M10.13 21.25Q11.11 21.91 12.57 20.94M10.13 21.25Q9.47 20.94 9.53 19.85M10.41 20.77Q11.62 21.62 13.47 20.42M10.41 20.77Q9.58 20.37 9.67 19.01M10.69 20.3Q12.11 21.33 14.32 19.93M10.69 20.3Q9.71 19.81 9.84 18.2M10.98 19.83Q12.59 21.02 15.13 19.46M10.98 19.83Q9.87 19.26 10.03 17.42M11.27 19.36Q13.05 20.71 15.89 19M11.27 19.36Q10.04 18.72 10.25 16.67M11.57 18.9Q13.49 20.4 16.63 18.57M11.57 18.9Q10.24 18.18 10.49 15.94M11.87 18.44Q13.93 20.08 17.33 18.15M11.87 18.44Q10.45 17.64 10.75 15.24M12.18 17.98Q14.35 19.76 18 17.75M12.18 17.98Q10.68 17.12 11.03 14.56M12.5 17.52Q14.76 19.43 18.64 17.35M12.5 17.52Q10.92 16.59 11.33 13.9M12.82 17.07Q15.17 19.09 19.24 16.97M12.82 17.07Q11.18 16.08 11.65 13.27M13.15 16.63Q15.56 18.75 19.82 16.6M13.15 16.63Q11.46 15.57 11.98 12.66M13.49 16.18Q15.95 18.4 20.37 16.24M13.49 16.18Q11.76 15.07 12.33 12.07M13.83 15.74Q15.2 17.01 17.71 15.82M13.83 15.74Q12.06 14.58 12.69 11.51M14.18 15.3Q15.56 16.61 18.14 15.43M14.18 15.3Q12.39 14.1 13.06 10.97M14.53 14.86Q15.92 16.22 18.56 15.04M14.53 14.86Q12.73 13.62 13.45 10.45M14.89 14.43Q17.42 16.95 22.29 14.84M14.89 14.43Q13.08 13.15 13.85 9.95M15.25 14Q17.78 16.57 22.71 14.51M15.25 14Q13.45 12.69 14.26 9.48M15.62 13.58Q18.13 16.18 23.1 14.17M15.62 13.58Q13.83 12.24 14.68 9.03M16 13.15Q18.47 15.79 23.47 13.83M16 13.15Q14.22 11.8 15.11 8.59M16.38 12.73Q18.82 15.38 23.81 13.49M16.38 12.73Q14.63 11.36 15.55 8.18M16.77 12.32Q19.16 14.97 24.13 13.16M16.77 12.32Q15.05 10.94 16 7.79M17.17 11.9Q19.49 14.56 24.44 12.82M17.17 11.9Q15.48 10.52 16.45 7.42M17.57 11.49Q19.83 14.13 24.72 12.47M17.57 11.49Q15.92 10.11 16.91 7.07M17.98 11.09Q20.17 13.7 24.99 12.13M17.98 11.09Q16.37 9.71 17.38 6.73M18.39 10.68Q20.5 13.26 25.23 11.77M18.39 10.68Q16.83 9.32 17.85 6.42M18.81 10.28Q20.84 12.82 25.47 11.42M18.81 10.28Q17.31 8.94 18.33 6.12M19.24 9.88Q21.18 12.37 25.68 11.06M19.24 9.88Q17.79 8.56 18.82 5.84M19.67 9.49Q21.52 11.91 25.89 10.69M19.67 9.49Q18.28 8.19 19.3 5.57M20.1 9.1Q21.86 11.45 26.08 10.32M20.1 9.1Q18.79 7.84 19.8 5.32M20.55 8.71Q22.21 10.98 26.27 9.94M20.55 8.71Q19.3 7.49 20.29 5.09M21 8.32Q22.56 10.51 26.44 9.56M21 8.32Q19.82 7.14 20.79 4.87M21.45 7.94Q22.91 10.03 26.61 9.17M21.45 7.94Q20.34 6.81 21.29 4.66M21.91 7.56Q23.27 9.55 26.77 8.77M21.91 7.56Q20.88 6.48 21.79 4.46M22.38 7.18Q23.64 9.06 26.92 8.37M22.38 7.18Q21.42 6.16 22.3 4.28M22.85 6.81Q24.01 8.57 27.07 7.96M22.85 6.81Q21.97 5.85 22.8 4.1M23.33 6.44Q24.38 8.08 27.22 7.54M23.33 6.44Q22.52 5.55 23.31 3.94M23.82 6.07Q24.76 7.59 27.37 7.12M23.82 6.07Q23.09 5.25 23.82 3.78M24.31 5.71Q25.15 7.09 27.52 6.69M24.31 5.71Q23.65 4.95 24.33 3.63M24.81 5.35Q25.55 6.59 27.67 6.25M24.81 5.35Q24.23 4.67 24.85 3.49M25.31 4.99Q25.95 6.09 27.82 5.81M25.31 4.99Q24.81 4.39 25.36 3.36M25.82 4.64Q26.36 5.59 27.98 5.36M25.82 4.64Q25.39 4.11 25.88 3.23M26.34 4.29Q26.78 5.09 28.14 4.91M26.34 4.29Q25.98 3.84 26.39 3.1M26.86 3.94Q27.21 4.59 28.31 4.46M26.86 3.94Q26.57 3.58 26.91 2.98M27.38 3.59Q27.65 4.09 28.49 4M27.38 3.59Q27.17 3.32 27.43 2.87" stroke-width=".26" opacity=".62"/>
            <path d="M8.2 25.05q1.5 1.11 2.9 -0.12M8.74 23.9q-1.56 -0.31 -1.5 -1.95M9.16 23.05q1.69 1.31 3.35 0.03M8.46 24.47q-1.95 -0.47 -1.95 -2.45M9.45 22.49q-1.67 -0.43 -1.56 -2.18" stroke-width=".28" opacity=".45"/>
            <path d="M7 28Q12.5 13 28 3.2" stroke-width=".7"/>
            <path d="M5.6 29.6 L7 28" stroke-width=".9" opacity=".8"/>
          </svg>
        </button>
        <button id="stop" class="seal" type="button" aria-label="停下" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
