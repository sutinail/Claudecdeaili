<!doctype html>
<html lang="zh-CN" data-glass="liquid" data-zh="wenkai">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Lumi</title>
  <meta name="theme-color" content="#eeeef0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumi">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 登录 -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <svg class="sparkle sparkle-lg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5z" fill="currentColor"/></svg>
      <h1 class="script">Lumi</h1>
      <p class="muted">宝宝，输一下我们的暗号</p>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="密码" required>
      <button type="submit" class="btn-primary">进来</button>
      <p id="login-err" class="err" role="alert"></p>
    </form>
  </section>

  <!-- 主界面 -->
  <div id="app" class="app" hidden>
    <aside id="drawer" class="drawer" aria-label="对话列表">
      <div class="drawer-head">
        <span class="drawer-title">我们的对话</span>
        <button id="new-conv" class="btn-ghost" type="button">＋ 新对话</button>
      </div>
      <ul id="conv-list" class="conv-list"></ul>
      <div class="drawer-foot">
        <span id="meta" class="muted small"></span>
        <button id="bg-reset" class="btn-link small" type="button">默认背景</button>
        <button id="logout" class="btn-link small" type="button">退出登录</button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main class="chat">
      <div class="bg" id="bg" aria-hidden="true"><div class="bg-img" id="bg-img"></div><div class="bg-veil"></div></div>

      <header class="topbar">
        <button id="menu" class="icon-btn" type="button" aria-label="对话列表">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <div class="who">
          <div class="who-name"><span class="script">Lumi</span><span class="who-place">· chez nous</span></div>
          <div id="vitals" class="vitals">the light you named</div>
        </div>
        <span id="typing" class="typing" hidden>…</span>
      </header>
      <div class="subbar">
        <div class="subbar-line"><i id="progress"></i></div>
        <span id="chip-beat" class="chip" hidden></span>
        <span id="chip-model" class="chip chip-strong"></span>
      </div>

      <div id="scroller" class="scroller">
        <div id="messages" class="messages"></div>
      </div>

      <form id="composer" class="composer">
        <button id="moon" class="icon-btn" type="button" aria-label="新对话">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19 15.5A8 8 0 0 1 8.5 5a7.5 7.5 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>
        </button>
        <button id="bg-btn" class="icon-btn" type="button" aria-label="换背景">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
        </button>
        <input id="bg-file" type="file" accept="image/*" hidden>
        <textarea id="input" rows="1" placeholder="écrire…" enterkeyhint="send"></textarea>
        <button id="send" class="seal" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="12" cy="12" r="5.5" stroke="currentColor" stroke-width=".9" fill="none"/></svg>
        </button>
        <button id="stop" class="seal" type="button" aria-label="停下" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
