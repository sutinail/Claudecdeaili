<!doctype html>
<html lang="zh-CN" data-glass="liquid" data-zh="wenkai">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Lumi · API</title>
  <meta name="theme-color" content="#eeeef0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumi">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/style.css?v=23">
</head>
<body>
  <div id="app" class="app api-app">
    <div class="bg" aria-hidden="true"><div class="bg-img" id="bg-img"></div><div class="bg-veil"></div></div>
    <div class="views">
      <main class="chat view">
        <header class="topbar">
          <a class="api-back" href="/" aria-label="回主页面">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </a>
          <div class="who">
            <div class="who-name"><span class="script">Lumi</span><span class="who-place">· par la clé</span></div>
            <div id="api-status" class="vitals">API 窗口 · 不经过服务器</div>
          </div>
        </header>
        <div class="subbar">
          <div class="subbar-line"><i id="progress"></i></div>
          <button id="api-new" class="chip" type="button">新对话</button>
          <button id="api-gear" class="chip chip-strong" type="button">设置</button>
        </div>

        <div id="scroller" class="scroller">
          <div id="messages" class="messages"></div>
        </div>

        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="écrire…" enterkeyhint="send"></textarea>
          <button id="send" class="seal quill" type="submit" aria-label="发送">
            <img src="/quill.png?v=1" alt="" width="30" height="34" draggable="false">
          </button>
          <button id="stop" class="seal" type="button" aria-label="停下" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
        </form>
      </main>
    </div>

    <div id="api-settings" class="settings" role="dialog" aria-label="API 窗口设置" hidden>
      <form id="api-form" class="settings-card">
        <div class="settings-head"><span class="script">la clé</span><button id="api-close" class="btn-link small" type="button">关闭</button></div>
        <section class="settings-sec">
          <div class="settings-k">API Key <span>钥匙</span></div>
          <p class="settings-note">在 Anthropic 控制台建一把 key，复制过来粘贴在这里。它只存在这台手机上，不会发给任何人，也<b>不要</b>发到聊天里。建议在控制台给它设一个每月花费上限。</p>
          <input id="api-key" class="api-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        </section>
        <section class="settings-sec">
          <div class="settings-k">modèle <span>模型</span></div>
          <select id="api-model" class="api-input">
            <option value="claude-opus-5-5">Opus 5.5（默认，最像我）</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5（便宜一半）</option>
          </select>
        </section>
        <section class="settings-sec">
          <div class="settings-k">mémoire <span>人设和记忆</span></div>
          <p id="api-sync-note" class="settings-note"></p>
          <div class="settings-row"><button id="api-sync" class="btn-link small" type="button">现在从服务器同步一次</button></div>
        </section>
        <button class="btn-primary" type="submit">保存</button>
      </form>
    </div>
  </div>
  <script src="/api.js?v=1"></script>
</body>
</html>
